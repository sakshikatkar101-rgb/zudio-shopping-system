version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: zudio_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword2026!
      MYSQL_DATABASE: zudio_db
      MYSQL_USER: zudio_user
      MYSQL_PASSWORD: ZudioStrongDbPassword2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -pRootPassword2026! || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zudio_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      APP_ENV: production
      DB_URL: jdbc:mysql://mysql:3306/zudio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: zudio_user
      DB_PASSWORD: ZudioStrongDbPassword2026!
      TOKEN_SECRET: zudio_enterprise_production_hmac_secret_key_min32chars!
      ADMIN_EMAIL: admin@zudio.in
      ADMIN_PASSWORD: AdminSecurePassword2026!
      ALLOWED_ORIGIN: "*"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:

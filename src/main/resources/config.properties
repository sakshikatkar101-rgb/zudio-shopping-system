# ========================================================
# ZUDIO Online Shopping Management System Configuration
# ========================================================

# Server Port
server.port=8080
server.host=0.0.0.0

# MySQL Database Configuration
# Standard MySQL 8.x / MariaDB compatible
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/zudio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# Connection Pool Settings
db.pool.maxConnections=15
db.pool.timeoutSeconds=30

# Static File Path
frontend.dir=frontend
